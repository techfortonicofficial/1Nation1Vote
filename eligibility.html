<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Eligibility Checker</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:"Segoe UI",sans-serif;
}

body{

background:
radial-gradient(circle at top left,
rgba(255,153,51,.25),
transparent 35%),

radial-gradient(circle at bottom right,
rgba(19,136,8,.25),
transparent 35%),

linear-gradient(135deg,#f5f7ff,#ffffff);

min-height:100vh;
padding:30px;
}

.container{

max-width:900px;
margin:auto;
}

.header{

background:white;
padding:30px;
border-radius:30px;
margin-bottom:25px;

box-shadow:
0 10px 35px rgba(0,0,0,.05);
}

.header h1{
color:#0b3c6d;
margin-bottom:10px;
}

.header p{
color:#666;
}

.card{

background:white;
padding:35px;
border-radius:30px;
margin-bottom:25px;

box-shadow:
0 10px 35px rgba(0,0,0,.05);
}

label{

display:block;
margin-bottom:10px;
font-weight:600;
}

input,select{

width:100%;
height:55px;

border:1px solid #ddd;
border-radius:16px;

padding:0 18px;
font-size:16px;

margin-bottom:20px;
}

button{

height:55px;
padding:0 28px;

border:none;
border-radius:16px;

background:#0b3c6d;
color:white;

font-size:16px;
font-weight:600;

cursor:pointer;

transition:.3s;
}

button:hover{
transform:translateY(-3px);
}

.result{

margin-top:25px;
padding:25px;

border-radius:20px;

background:#f4f7ff;

display:none;
}

.success{
border-left:6px solid #138808;
}

.fail{
border-left:6px solid #d90429;
}

.constituency-box{

margin-top:20px;
padding:20px;

border-radius:20px;

background:#eef3ff;
}

.language{

margin-bottom:20px;
}

.footer{

text-align:center;
margin-top:20px;
color:#666;
}

</style>
</head>

<body>

<div class="container">

<div class="header">

<h1 id="title">
Voter Eligibility Checker
</h1>

<p id="subtitle">
Check your voting eligibility and constituency details.
</p>

</div>

<div class="card">

<div class="language">

<label id="langLabel">
Language
</label>

<select onchange="setLanguage(this.value)">

<option value="english">English</option>
<option value="hindi">हिन्दी</option>
<option value="odia">ଓଡ଼ିଆ</option>
<option value="bengali">বাংলা</option>
<option value="tamil">தமிழ்</option>
<option value="telugu">తెలుగు</option>

</select>

</div>

<label id="dobLabel">
Enter Date of Birth
</label>

<input type="date" id="dob">

<button onclick="checkEligibility()" id="checkBtn">
Check Eligibility
</button>

<div class="result" id="resultBox">

<h2 id="resultTitle"></h2>

<p id="resultText"></p>

</div>

</div>

<div class="card">

<h2 id="constituencyTitle">
Find Your Constituency
</h2>

<br>

<label id="stateLabel">
Select State
</label>

<select id="state">

<option>Odisha</option>
<option>Maharashtra</option>
<option>Delhi</option>
<option>Tamil Nadu</option>
<option>Karnataka</option>

</select>

<label id="districtLabel">
Enter District
</label>

<input type="text" id="district"
placeholder="Example: Khordha">

<button onclick="findConstituency()"
id="findBtn">

Find Constituency

</button>

<div class="constituency-box"
id="constituencyResult"
style="display:none;">

<h3 id="constituencyName"></h3>

<p id="constituencyDetails"></p>

</div>

</div>

<div class="footer">

© 2026 One Nation One Vote

</div>

</div>

<script>

/* LANGUAGE */

const translations = {

english:{

title:"Voter Eligibility Checker",
subtitle:"Check your voting eligibility and constituency details.",
langLabel:"Language",
dobLabel:"Enter Date of Birth",
checkBtn:"Check Eligibility",
eligible:"You are eligible to vote.",
notEligible:"You are not eligible to vote yet.",
constituencyTitle:"Find Your Constituency",
stateLabel:"Select State",
districtLabel:"Enter District",
findBtn:"Find Constituency"

},

hindi:{

title:"मतदाता पात्रता जांच",
subtitle:"अपनी मतदान पात्रता और निर्वाचन क्षेत्र देखें।",
langLabel:"भाषा",
dobLabel:"जन्म तिथि दर्ज करें",
checkBtn:"पात्रता जांचें",
eligible:"आप मतदान के लिए पात्र हैं।",
notEligible:"आप अभी मतदान के लिए पात्र नहीं हैं।",
constituencyTitle:"अपना निर्वाचन क्षेत्र खोजें",
stateLabel:"राज्य चुनें",
districtLabel:"जिला दर्ज करें",
findBtn:"निर्वाचन क्षेत्र खोजें"

},

odia:{

title:"ଭୋଟର ଯୋଗ୍ୟତା ଯାଞ୍ଚ",
subtitle:"ଆପଣଙ୍କର ଭୋଟ ଯୋଗ୍ୟତା ଏବଂ ନିର୍ବାଚନ ମଣ୍ଡଳ ଯାଞ୍ଚ କରନ୍ତୁ।",
langLabel:"ଭାଷା",
dobLabel:"ଜନ୍ମ ତାରିଖ ଦିଅନ୍ତୁ",
checkBtn:"ଯୋଗ୍ୟତା ଯାଞ୍ଚ କରନ୍ତୁ",
eligible:"ଆପଣ ଭୋଟ ପାଇଁ ଯୋଗ୍ୟ।",
notEligible:"ଆପଣ ଏପର୍ଯ୍ୟନ୍ତ ଯୋଗ୍ୟ ନୁହନ୍ତି।",
constituencyTitle:"ଆପଣଙ୍କ ନିର୍ବାଚନ ମଣ୍ଡଳ ଖୋଜନ୍ତୁ",
stateLabel:"ରାଜ୍ୟ ବାଛନ୍ତୁ",
districtLabel:"ଜିଲ୍ଲା ଲେଖନ୍ତୁ",
findBtn:"ନିର୍ବାଚନ ମଣ୍ଡଳ ଖୋଜନ୍ତୁ"

}

};

/* APPLY LANGUAGE */

function applyLanguage(){

const lang =
localStorage.getItem("lang") || "english";

const t =
translations[lang] || translations.english;

document.getElementById("title").innerText = t.title;
document.getElementById("subtitle").innerText = t.subtitle;
document.getElementById("langLabel").innerText = t.langLabel;
document.getElementById("dobLabel").innerText = t.dobLabel;
document.getElementById("checkBtn").innerText = t.checkBtn;
document.getElementById("constituencyTitle").innerText = t.constituencyTitle;
document.getElementById("stateLabel").innerText = t.stateLabel;
document.getElementById("districtLabel").innerText = t.districtLabel;
document.getElementById("findBtn").innerText = t.findBtn;

}

/* SET LANGUAGE */

function setLanguage(lang){

localStorage.setItem("lang", lang);

applyLanguage();

}

/* CHECK AGE */

function checkEligibility(){

const dob =
document.getElementById("dob").value;

if(!dob){

alert("Please enter your date of birth");
return;

}

const birthDate =
new Date(dob);

const today =
new Date();

let age =
today.getFullYear() -
birthDate.getFullYear();

const monthDiff =
today.getMonth() -
birthDate.getMonth();

if(
monthDiff < 0 ||
(monthDiff === 0 &&
today.getDate() < birthDate.getDate())
){

age--;

}

const resultBox =
document.getElementById("resultBox");

const resultTitle =
document.getElementById("resultTitle");

const resultText =
document.getElementById("resultText");

const lang =
localStorage.getItem("lang") || "english";

const t =
translations[lang];

resultBox.style.display = "block";

if(age >= 18){

resultBox.className =
"result success";

resultTitle.innerText =
"✅ Eligible";

resultText.innerText =
t.eligible + " Age: " + age;

}else{

resultBox.className =
"result fail";

resultTitle.innerText =
"❌ Not Eligible";

resultText.innerText =
t.notEligible + " Age: " + age;

}

}

/* FIND CONSTITUENCY */

function findConstituency(){

const state =
document.getElementById("state").value;

const district =
document.getElementById("district").value;

const box =
document.getElementById("constituencyResult");

const name =
document.getElementById("constituencyName");

const details =
document.getElementById("constituencyDetails");

box.style.display = "block";

/* SAMPLE DATA */

if(
state === "Odisha" &&
district.toLowerCase() === "khordha"
){

name.innerText =
"Bhubaneswar Constituency";

details.innerText =
"Lok Sabha Constituency: Bhubaneswar | MLA Region: Central Bhubaneswar | Polling Zones Available.";

}else if(
state === "Delhi"
){

name.innerText =
"New Delhi Constituency";

details.innerText =
"Lok Sabha Constituency: New Delhi | Urban Voting Region.";

}else{

name.innerText =
"Constituency Found";

details.innerText =
"Your constituency details will appear here.";

}

}

/* AUTO LOAD */

applyLanguage();

</script>

</body>
</html>
