background:
linear-gradient(135deg,#f5f7ff,#ffffff);

.card{
width:420px;
background:white;
padding:40px;
border-radius:30px;
box-shadow:0 10px 40px rgba(0,0,0,.08);
}

h2{
margin-bottom:25px;
}

.info{
margin:15px 0;
font-size:17px;
}

.verify{
margin-top:20px;
padding:15px;
background:#e8fff0;
border-radius:15px;
color:#138808;
font-weight:600;
}

button{
width:100%;
height:55px;
margin-top:25px;
border:none;
border-radius:16px;
background:#2F6BFF;
color:white;
font-size:16px;
cursor:pointer;
}

</style>
